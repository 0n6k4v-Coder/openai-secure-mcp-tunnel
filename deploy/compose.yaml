services:
  openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:${OPENSHELL_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: []
    user: "0"
    ports:
      - "127.0.0.1:${OPENSHELL_PORT:-8080}:8080"
      - "127.0.0.1:${OPENSHELL_HEALTH_PORT:-8081}:8081"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${MCP_CONFIG_DIR:-/var/lib/local-mcp-server/config}
        target: /var/lib/local-mcp-server/config
        bind:
          create_host_path: true
      - type: bind
        source: ./openshell/gateway.toml
        target: /etc/openshell/gateway.toml
        read_only: true
      - type: bind
        source: ./openshell/jwt
        target: /etc/openshell/jwt
        read_only: true
      - type: bind
        source: ../.secrets/openshell-tls/gateway
        target: /etc/openshell/certs
        read_only: true
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: sqlite:/var/lib/local-mcp-server/config/openshell.db
      XDG_DATA_HOME: /var/lib/local-mcp-server/config
      XDG_STATE_HOME: /var/lib/local-mcp-server/config
      HOME: /var/lib/local-mcp-server/config
      OPENSHELL_TLS_CERT: /etc/openshell/certs/gateway.crt
      OPENSHELL_TLS_KEY: /etc/openshell/certs/gateway.key
      OPENSHELL_TLS_CLIENT_CA: /etc/openshell/certs/ca.crt
      OPENSHELL_ENABLE_MTLS_AUTH: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.openshell.internal:host-gateway"
    networks:
      - openshell-gateway
      - openshell-internal

  mcp-server:
    build:
      context: ..
      dockerfile: deploy/docker/mcp-server/Dockerfile
    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    volumes:
      - ${MCP_STATE_DIR:-../.state}:/var/lib/local-mcp-server/state:rw
      - ${WORKSPACE_GRANTS_DIR:-../.state/workspace-grants}:/var/lib/local-mcp-server/workspace-grants:ro
      - type: bind
        source: ./openshell/gateway-metadata.json
        target: /config/openshell/gateways/local/metadata.json
        read_only: true
      - type: bind
        source: ../.secrets/openshell-tls/client
        target: /config/openshell/gateways/local/mtls
        read_only: true
      - type: bind
        source: ../.secrets/openshell-tls/client
        target: /etc/openshell
        read_only: true
    networks:
      - mcp-internal
      - openshell-internal
      - mcp-host-publish
    depends_on:
      openshell-gateway:
        condition: service_started
    environment:
      OPENSHELL_WORKSPACE: ${OPENSHELL_WORKSPACE:-default}
      OPENSHELL_GATEWAY: ${OPENSHELL_GATEWAY:-local}
      XDG_CONFIG_HOME: /config
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-local-mcp-openshell-sandbox:1.0.0}
      SANDBOX_DEFAULT_CPU: ${SANDBOX_DEFAULT_CPU:-1}
      SANDBOX_DEFAULT_MEMORY: ${SANDBOX_DEFAULT_MEMORY:-1Gi}
      WORKSPACE_GRANTS_FILE: /var/lib/local-mcp-server/workspace-grants/workspace-grants.json
      WORKSPACE_GRANTS_READ_ONLY: "true"
      INSTALLATION_STATE_FILE: /var/lib/local-mcp-server/state/installations.json
      LOG_LEVEL: INFO
      OPENSHELL_SYSTEM_GATEWAY_DIR: /config
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "8000"

  browser-runtime:
    build:
      context: ./docker/browser-runtime
      dockerfile: Dockerfile
      args:
        CHROME_VERSION: ${CHROME_FOR_TESTING_VERSION:-154.0.8037.92}
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    security_opt:
      - seccomp:./docker/browser-runtime/seccomp.json
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /dev/shm:rw,nosuid,nodev,size=1g
    extra_hosts:
      - "host.openshell.internal:host-gateway"
    environment:
      BROWSER_BIND_HOST: ${BROWSER_BIND_HOST:-host.openshell.internal}
      BROWSER_PORT: ${BROWSER_PORT:-9222}
      BROWSER_USER_DATA_DIR: /tmp/chrome-profile
      XDG_CACHE_HOME: /tmp/cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://${BROWSER_BIND_HOST:-host.openshell.internal}:${BROWSER_PORT:-9222}/json/version >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.15
    depends_on:
      mcp-server:
        condition: service_healthy
      browser-runtime:
        condition: service_healthy
    networks:
      - mcp-internal
      - tunnel-egress
    environment:
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?CONTROL_PLANE_TUNNEL_ID is required}
    entrypoint:
      - tunnel-client
    command:
      - run
      - --control-plane.api-key=file:/run/secrets/control_plane_api_key
    secrets:
      - control_plane_api_key

networks:
  mcp-internal:
    internal: true
  openshell-internal:
    internal: true
  mcp-host-publish:
    driver: bridge
  openshell-gateway:
    driver: bridge
  tunnel-egress:

secrets:
  control_plane_api_key:
    file: ../.secrets/control-plane-api-key
