services:
  openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:${OPENSHELL_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: []
    user: "0"

    ports:
      - "127.0.0.1:${OPENSHELL_PORT:-8080}:8080"
      - "127.0.0.1:${OPENSHELL_HEALTH_PORT:-8081}:8081"

    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock

      - type: bind
        source: ${MCP_CONFIG_DIR:-/var/lib/local-mcp-server/config}
        target: /var/lib/local-mcp-server/config
        bind:
          create_host_path: true

      - type: bind
        source: ./openshell/gateway.toml
        target: /etc/openshell/gateway.toml
        read_only: true

      - type: bind
        source: ./openshell/jwt
        target: /etc/openshell/jwt
        read_only: true

    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: sqlite:/var/lib/local-mcp-server/config/openshell.db
      XDG_DATA_HOME: /var/lib/local-mcp-server/config
      XDG_STATE_HOME: /var/lib/local-mcp-server/config
      HOME: /var/lib/local-mcp-server/config

    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.openshell.internal:host-gateway"

    networks:
      - openshell-gateway
      - openshell-internal

  mcp-server:
    build:
      context: ..
      dockerfile: deploy/docker/mcp-server/Dockerfile

    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"

    ports:
      - "127.0.0.1:8000:8000"

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

    volumes:
      - ${MCP_INSTALLATION_STATE_FILE:-../.state/installations.json}:/var/lib/local-mcp-server/installations.json:rw
      - ${WORKSPACE_GRANTS_DIR:-../.state/workspace-grants}:/var/lib/local-mcp-server/workspace-grants:ro

    networks:
      - mcp-internal
      - openshell-internal
      - mcp-host-publish

    depends_on:
      openshell-gateway:
        condition: service_started

    environment:
      OPENSHELL_GATEWAY: ${OPENSHELL_GATEWAY:-openshell-gateway:8080}
      OPENSHELL_WORKSPACE: ${OPENSHELL_WORKSPACE:-default}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-local-mcp-openshell-sandbox:1.0.0}
      SANDBOX_DEFAULT_CPU: ${SANDBOX_DEFAULT_CPU:-1}
      SANDBOX_DEFAULT_MEMORY: ${SANDBOX_DEFAULT_MEMORY:-1Gi}
      WORKSPACE_GRANTS_FILE: /var/lib/local-mcp-server/workspace-grants/workspace-grants.json
      WORKSPACE_GRANTS_READ_ONLY: "true"
      INSTALLATION_STATE_FILE: /var/lib/local-mcp-server/installations.json
      LOG_LEVEL: INFO

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    expose:
      - "8000"

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.15

    depends_on:
      mcp-server:
        condition: service_healthy

    networks:
      - mcp-internal
      - tunnel-egress

    environment:
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?CONTROL_PLANE_TUNNEL_ID is required}

    entrypoint:
      - tunnel-client

    command:
      - run
      - --control-plane.api-key=file:/run/secrets/control_plane_api_key

    secrets:
      - control_plane_api_key

networks:
  mcp-internal:
    internal: true

  openshell-internal:
    internal: true

  mcp-host-publish:
    driver: bridge

  openshell-gateway:
    driver: bridge

  tunnel-egress:

secrets:
  control_plane_api_key:
    file: ../.secrets/control-plane-api-key
