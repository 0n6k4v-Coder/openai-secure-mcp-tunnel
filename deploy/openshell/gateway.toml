[openshell]
version = 2

[openshell.gateway]
bind_address = "127.0.0.1:8080"
health_bind_address = "127.0.0.1:8081"
log_level = "info"
compute_driver = "docker"

server_sans = [
  "openshell-gateway",
  "host.openshell.internal",
  "localhost",
  "127.0.0.1",
]

disable_tls = false

guest_tls_ca = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/ca.crt"
guest_tls_cert = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/client/tls.crt"
guest_tls_key = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/client/tls.key"

[openshell.gateway.tls]
cert_path = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/server/tls.crt"
key_path = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/server/tls.key"
client_ca_path = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/ca.crt"

[openshell.gateway.auth]
allow_unauthenticated_users = false

[openshell.gateway.mtls_auth]
enabled = true

[openshell.gateway.gateway_jwt]
signing_key_path = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/jwt/signing.pem"
public_key_path = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/jwt/public.pem"
kid_path = "${OPENSHELL_TLS_HOST_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/local-mcp-server/openshell/tls}/jwt/kid"
gateway_id = "openai-secure-mcp-tunnel"

[openshell.gateway.credential_storage]
key_encryption_key_path = "/var/lib/local-mcp-server/config/credentials/key-encryption-key.bin"

[openshell.drivers.docker]
socket_path = "/var/run/docker.sock"
default_image = "local-mcp-openshell-sandbox:1.0.0"
image_pull_policy = "if_not_present"
sandbox_label = "openshell"
grpc_endpoint = "https://host.openshell.internal:8080"
allow_driver_config = true
enable_bind_mounts = true

[openshell.drivers.docker.resource_admission]
enabled = false