[project]
name = "local-mcp-server"
version = "0.1.0"
description = "Private local MCP server for OpenAI Secure MCP Tunnel"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argcomplete==3.7.2",
    "mcp[cli]==2.3.0",
    "openshell==0.1.2",
    "starlette",
]

[project.scripts]
mcpctl = "local_mcp_server.cli.completion:mcpctl_main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.13,<0.14",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
markers = [
    "integration: tests that require externally running MCP, OpenShell, or Docker services",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
