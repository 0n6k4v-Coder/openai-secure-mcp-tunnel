services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile

    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

    volumes:
      - ./workspace:/app/workspace:rw

    networks:
      - mcp-internal

    extra_hosts:
      - "host.docker.internal:host-gateway"

    secrets:
      - local_terminal_executor_token

    environment:
      TERMINAL_EXECUTOR_URL: http://host.docker.internal:8765
      TERMINAL_EXECUTOR_TOKEN_FILE: /run/secrets/local_terminal_executor_token

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    expose:
      - "8000"

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.15

    depends_on:
      mcp-server:
        condition: service_healthy

    networks:
      - mcp-internal

    environment:
      MCP_SERVER_URL: http://mcp-server:8000/mcp

    secrets:
      - control_plane_api_key

    volumes:
      - ./config:/config:ro

networks:
  mcp-internal:
    internal: true

secrets:
  control_plane_api_key:
    file: .secrets/control-plane-api-key

  local_terminal_executor_token:
    file: .secrets/terminal-agent-token