services:
  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server/Dockerfile

    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

    volumes:
      - ./workspace:/app/workspace:rw

    secrets:
      - local_terminal_executor_token

    networks:
      - mcp-internal

    depends_on:
      terminal-executor:
        condition: service_healthy

    environment:
      TERMINAL_EXECUTOR_URL: http://terminal-executor:8765
      TERMINAL_EXECUTOR_TOKEN_FILE: /run/secrets/local_terminal_executor_token

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    expose:
      - "8000"

  terminal-executor:
    build:
      context: .
      dockerfile: docker/terminal-executor/Dockerfile

    command:
      [
        "python",
        "/app/host/terminal_executor.py"
      ]

    user: "${TERMINAL_EXECUTOR_UID:-1000}:${TERMINAL_EXECUTOR_GID:-1000}"

    working_dir: /workspace

    init: true

    shm_size: "1gb"

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

    volumes:
      - ./workspace:/workspace:rw

    secrets:
      - local_terminal_executor_token

    networks:
      - mcp-internal
      - dev-egress

    environment:
      LOCAL_TERMINAL_EXECUTOR_HOST: 0.0.0.0
      LOCAL_TERMINAL_EXECUTOR_PORT: "8765"
      LOCAL_TERMINAL_EXECUTOR_TOKEN_FILE: /run/secrets/local_terminal_executor_token
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      LOG_LEVEL: INFO

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    expose:
      - "8765"

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.15

    depends_on:
      mcp-server:
        condition: service_healthy

    networks:
      - mcp-internal
      - tunnel-egress

    environment:
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?CONTROL_PLANE_TUNNEL_ID is required}

    entrypoint:
      - tunnel-client

    command:
      - run
      - --control-plane.api-key=file:/run/secrets/control_plane_api_key

    secrets:
      - control_plane_api_key

networks:
  mcp-internal:
    internal: true

  dev-egress:

  tunnel-egress:

secrets:
  control_plane_api_key:
    file: .secrets/control-plane-api-key

  local_terminal_executor_token:
    file: .secrets/terminal-agent-token
