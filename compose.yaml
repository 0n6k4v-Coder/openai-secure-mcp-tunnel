services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile

    image: local-mcp-server:dev

    restart: unless-stopped

    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

    environment:
      WORKSPACE_DIR: /app/workspace
      LOG_LEVEL: INFO
      TERMINAL_EXECUTOR_URL: http://host.docker.internal:8765
      TERMINAL_EXECUTOR_TOKEN_FILE: /run/secrets/local_terminal_executor_token

    extra_hosts:
      - "host.docker.internal:host-gateway"

    secrets:
      - local_terminal_executor_token

    volumes:
      - ./workspace:/app/workspace:rw

    networks:
      - mcp-internal

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.15

    restart: unless-stopped

    command:
      - run
      - --control-plane.api-key=file:/run/secrets/control_plane_api_key

    environment:
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
      MCP_STARTUP_WAIT_TIMEOUT: 30s
      MCP_CONNECTION_MAX_TTL: 10m

    secrets:
      - control_plane_api_key

    depends_on:
      mcp-server:
        condition: service_healthy

    networks:
      - mcp-internal
      - tunnel-egress

networks:
  mcp-internal:
    internal: true

  tunnel-egress:

secrets:
  control_plane_api_key:
    file: .secrets/control-plane-api-key

  local_terminal_executor_token:
    file: .secrets/local-terminal-executor-token
